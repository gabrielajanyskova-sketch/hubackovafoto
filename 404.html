<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena | Nikola Hubáčková Fotografka</title>
<meta name="description" content="Stránka nebyla nalezena.">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#4a5e4a">

<link rel="stylesheet" href="/fonts/fonts.css">

<style>
  :root {
    --cream: #faf8f4;
    --warm: #f2ede4;
    --sand: #e8ddd0;
    --stone: #c4b8a8;
    --forest: #4a5e4a;
    --forest-light: #6b8a6b;
    --dark: #2a2018;
    --text: #3a2e22;
    --text-dim: #5a4a3a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Jost', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  :focus-visible {
    outline: 2px solid var(--forest);
    outline-offset: 3px;
  }

  /* NAV */
  nav {
    padding: 24px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(196,184,168,0.2);
  }

  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; color: var(--dark); letter-spacing: 0.3px; }
  .logo-title { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #3a5a3a; font-weight: 500; }

  /* HLAVNÍ OBSAH */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
  }

  .thank-you-wrap {
    max-width: 620px;
    text-align: center;
  }

  /* Animovaná ikona */
  .check-circle {
    width: 88px;
    height: 88px;
    margin: 0 auto 40px;
    animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s 0.15s ease both;
  }
  .eyebrow-line { width: 30px; height: 1px; background: var(--forest); }
  .eyebrow-text { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #3a5a3a; font-weight: 500; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 6vw, 68px);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.5px;
    color: var(--dark);
    margin-bottom: 20px;
    animation: fadeUp 0.6s 0.25s ease both;
  }
  h1 em { font-style: italic; color: var(--forest); }

  .perex {
    font-size: 17px;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 50px;
    animation: fadeUp 0.6s 0.35s ease both;
  }

  /* Co se děje dál */
  .next-steps {
    background: var(--warm);
    border: 1px solid var(--sand);
    padding: 36px 40px;
    text-align: left;
    margin-bottom: 48px;
    animation: fadeUp 0.6s 0.45s ease both;
  }

  .next-steps-title {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--forest);
    font-weight: 500;
    margin-bottom: 20px;
  }

  .next-steps ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .next-steps li {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--forest);
    line-height: 1;
    flex-shrink: 0;
    margin-top: -2px;
  }

  /* Tlačítka */
  .btn-wrap {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.6s 0.55s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--forest);
    color: white;
    padding: 16px 36px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    font-family: 'Jost', sans-serif;
  }
  .btn-primary:hover { background: var(--dark); gap: 18px; }
  .btn-primary svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--text-dim);
    padding: 16px 28px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid var(--sand);
    transition: all 0.3s;
    font-family: 'Jost', sans-serif;
  }
  .btn-ghost:hover { border-color: var(--forest); color: var(--forest); }
  .btn-ghost svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* FOOTER */
  footer {
    background: var(--dark);
    padding: 28px 60px;
  }
  .footer-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(250,248,244,0.52);
    flex-wrap: wrap;
    gap: 10px;
  }
  .footer-bottom a { color: #8db88d; text-decoration: none; }

  @media (max-width: 600px) {
    nav { padding: 18px 24px; }
    footer { padding: 24px; }
    .next-steps { padding: 28px 24px; }
    .btn-wrap { flex-direction: column; align-items: center; }
    .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
  }

  /* TEXTOVÁ STRÁNKA */
  main.doc { display: block; padding: 60px 24px 90px; }
  .doc-wrap { max-width: 760px; margin: 0 auto; }
  .doc-wrap h1 { text-align: left; font-size: clamp(36px, 5vw, 56px); margin-bottom: 12px; animation: none; }
  .doc-wrap .updated { font-size: 13px; color: var(--text-dim); margin-bottom: 40px; }
  .doc-wrap h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 28px; color: var(--dark); margin: 40px 0 12px; }
  .doc-wrap p, .doc-wrap li { font-size: 16px; line-height: 1.8; color: var(--text-dim); }
  .doc-wrap p { margin-bottom: 14px; }
  .doc-wrap ul { margin: 0 0 14px 22px; }
  .doc-wrap a { color: var(--forest); }
  .doc-wrap button { font: inherit; color: var(--forest); background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

        <path d="M0,-7 Q3.5,-5 3.5,0 Q3.5,2 1,3 Q-1,4 -3,2 L-1,-6 Z" fill="#4a5e4a" opacity="0.85" transform="rotate(120)"/>
        <path d="M0,-7 Q3.5,-5 3.5,0 Q3.5,2 1,3 Q-1,4 -3,2 L-1,-6 Z" fill="#4a5e4a" opacity="0.85" transform="rotate(180)"/>
        <path d="M0,-7 Q3.5,-5 3.5,0 Q3.5,2 1,3 Q-1,4 -3,2 L-1,-6 Z" fill="#4a5e4a" opacity="0.85" transform="rotate(240)"/>
        <path d="M0,-7 Q3.5,-5 3.5,0 Q3.5,2 1,3 Q-1,4 -3,2 L-1,-6 Z" fill="#4a5e4a" opacity="0.85" transform="rotate(300)"/>

      <span class="logo-name">Nikola Hubáčková</span>

</nav>

  <div class="thank-you-wrap">
    <div class="eyebrow" aria-hidden="true">
      <div class="eyebrow-line"></div>

      <a href="/" class="btn-primary">

<footer>
